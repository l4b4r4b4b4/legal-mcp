# Pre-commit hooks for legal-mcp
# Install with: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes, --exit-non-zero-on-fix]
      - id: ruff-format

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.zed/
      - id: end-of-file-fixer
        exclude: ^\.zed/
      - id: check-yaml
        exclude: ^\.zed/
      - id: check-json
        exclude: ^\.zed/
      - id: check-toml
        exclude: ^\.zed/
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        files: ^app/


  # Test coverage gate (runs on push only — too slow for every commit)
  - repo: local
    hooks:
      - id: pytest-coverage
        name: pytest + coverage (≥73%)
        entry: uv run pytest --cov --cov-report=term-missing -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# CI configuration
ci:
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autofix_prs: true
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: weekly
